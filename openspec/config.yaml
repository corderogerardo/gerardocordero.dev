# openspec/config.yaml — SDD config for gerardocordero.dev (generated by sdd-init, 2026-08-08)
schema: spec-driven

context: |
  Monorepo: pnpm@10.11.0 workspaces + Turbo ^2.5, Node 20 (CI), node-linker=hoisted.
  Active app: apps/portfolio — Expo SDK 56 / RN 0.85 / React 19 / expo-router / NativeWind.
  Static sites: apps/learn (Next.js 16 → academy.gerardocordero.dev) + 5 *-prep apps (Next.js 16 → Cloudflare Pages).
  Reference apps: apps/ios (SwiftUI/XcodeGen), apps/android (Compose/Gradle), apps/backend (FastAPI/pytest), apps/pawwalk-api (Rails 8.1, Ruby 3.4).
  Loop gate: pnpm typecheck && pnpm lint && pnpm test (Turbo, cached); enforced by .github/workflows/ci.yml verify job.
  Content voice: senior-coach (see .agents/skills/senior-coach-content/SKILL.md) for all prep/learn content.

strict_tdd: true

testing:
  strict_tdd: true
  unit:
    - portfolio: jest-expo (Jest 29) + @testing-library/react-native ^14 — pnpm --filter @gerardocordero/portfolio test (tests in apps/portfolio/__tests__/)
    - learn: node --test (validator tests) — pnpm --filter @gerardocordero/learn test
    - backend: pytest (testpaths=tests) — cd apps/backend && pip install -e ".[dev]" && pytest
    - pawwalk-api: Rails minitest — cd apps/pawwalk-api && mise x -- bin/rails test
  e2e:
    - portfolio: Maestro 2.6.1 (.maestro/ smoke.yml, walk-tabs.yml, study.yml) — local iOS sim; cloud iOS+Android via manual EAS workflow
  coverage:
    - portfolio: available — jest --ci --runInBand --coverage (test:ci)
  quality:
    - linter: eslint ^9 — eslint-config-expo (portfolio, flat config), eslint-config-next (learn/prep)
    - typecheck: tsc --noEmit — portfolio TS ~6.0.3 (types: [] load-bearing); prep apps via typescript7 (TS 7 Go-native)
    - formatter: none detected
  build_gates:
    - learn: node tools/validate.mjs && node tools/i18n-check.mjs && next build
    - ios: xcodegen generate && xcodebuild -scheme PawWalk (CI path-filtered)
    - android: ./gradlew assembleDebug (CI path-filtered)

rules:
  proposal:
    - State the workspace(s) the change touches; each app has its own deploy gate
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Follow existing app patterns; RNTL v14 is async-by-default (await render / await fireEvent)
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Preserve the testID contract (tab-<route> / screen-<name>) shared by unit + Maestro
    tdd: true
    test_command: "pnpm --filter @gerardocordero/portfolio test"
  verify:
    test_command: "pnpm typecheck && pnpm lint && pnpm test"
    build_command: "pnpm build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
