appId: dev.gerardocordero.meridian
---
# Cold-launch step shared by every flow. `clearState: false` keeps the session so
# a signed-in device goes straight to the tabs.
- launchApp:
    clearState: false
- waitForAnimationToEnd
# A lingering iOS "Save Password?" sheet is not part of the app.
- tapOn:
    text: "Not Now"
    optional: true
