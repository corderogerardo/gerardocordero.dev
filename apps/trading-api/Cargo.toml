[package]
name = "trading-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Paper-trading API: Axum, PostgreSQL, decimal money, real-time quotes"
license = "MIT"
publish = false

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "migrate", "macros", "rust_decimal", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors", "request-id", "limit", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
futures-util = { version = "0.3.34", features = ["sink"] }
reqwest = { version = "0.13.5", features = ["json"] }
rust_decimal_macros = "1.40.0"
tokio-tungstenite = "0.30.0"
